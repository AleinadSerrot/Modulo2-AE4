<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio Web con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar-personalizada">
        <div class="container-flex">
            <div class="logo">
    <img src="LogoDanix.jpg" alt="Logo Danix" class="img-logo-personalizado">
</div>
            <ul class="menu-navegacion">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#acerca">Acerca de</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <header id="inicio" class="encabezado-principal">
        <div class="container">
            <h1 class="texto-bienvenida">Bienvenido a Soft Skull Store</h1> <!-- nombre tentativo de mi tiendita -->
            <p class="mision-texto">TEXTO DESCRIPTIVO DE LA TIENDITA</p>
        </div>
    </header>

    <section id="acerca" class="seccion-contenido">
        <div class="container">
            <div class="row">
                <div class="col-md-4 columna-item">
                    <h3>Recursos Digitales</h3>
                    <p>Productos digitales</p>
                    <button class="btn-bootstrap-custom btn-primario">Buscar</button>
                </div>
                <div class="col-md-4 columna-item">
                    <h3>Venta de Arte</h3>
                    <p>"Cute, geek and spooky art"</p>
                    <button class="btn-bootstrap-custom btn-secundario">Vitrina</button>
                </div>
                <div class="col-md-4 columna-item">
                    <h3>¿Cómo contactarnos?</h3>
                    <p>Tienda online, RRSS</p>
                    <button class="btn-bootstrap-custom btn-info-estilo">Contacto</button>
                </div>
            </div>
        </div>
    </section>

    <section id="contacto" class="formulario-seccion">
        <div class="container">
            <form class="formulario-estilizado">
                <div class="campo">
                    <label>Nombre</label>
                    <input type="text" class="form-control">
                </div>
                <div class="campo">
                    <label>Correo electrónico</label>
                    <input type="email" class="form-control">
                </div>
                <div class="campo">
                    <label>Comentarios</label>
                    <textarea class="form-control" rows="4"></textarea>
                </div>
                <button type="submit" class="btn-envio">Enviar Mensaje</button>
            </form>
        </div>
    </section>

    <footer class="footer-final">
        <div class="container">
            <p>Creado por Daniela</p>
            <p>Todos los derechos reservados &copy; 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
